name: Dependabot Auto-Merge

# Turns routine dependency bumps into no-touch merges. This only *enables*
# GitHub's auto-merge on the PR; branch protection on main still gates the
# actual merge behind every required check in ci.yml. If CI goes red the PR
# stays open, exactly as it does today.
on: pull_request

# Workflows triggered by Dependabot get a read-only token by default, so the
# write scopes needed to enable auto-merge have to be requested explicitly.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge for Dependabot
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
