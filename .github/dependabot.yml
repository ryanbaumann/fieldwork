version: 2

# Every ecosystem groups its weekly minor and patch bumps into a single PR.
# Fifteen separate one-line PRs (2026-08) cost more review attention than the
# updates were worth. Majors stay ungrouped so a breaking change isolates to
# its own PR, and dependabot-auto-merge.yml enables squash auto-merge for all
# Dependabot PRs once the full CI suite passes.
updates:
  - package-ecosystem: "npm"
    directory: "/demos/strava-explorer"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

