<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="A values filter diagram showing noisy defaults on the left (five AI plans before 8am, urgency and prestige, and completionism) blocked by a central Values Filter gate, while three personal pillars pass through on the right: Family Window, Freedom Today, and Health and Craft.">
  <style>
    :root { --bg: #faf9f6; --surface: #ffffff; --ink: #111827; --faint: #5f6875; --line: #d9dde5; --accent: #3b82f6; --accent-ink: #2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #030712; --surface: #111827; --ink: #f9fafb; --faint: #aeb7c4; --line: #334155; --accent: #60a5fa; --accent-ink: #93c5fd; } }</style>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="var(--line)" stroke-width="1" opacity="0.28"/></pattern>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"/></marker>
  </defs>
  <rect width="1200" height="675" fill="var(--bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="8" fill="var(--accent)"/>
  <rect x="1" y="1" width="1198" height="673" fill="none" stroke="var(--line)" stroke-width="2"/>
  <rect x="70" y="46" width="384" height="44" rx="22" fill="var(--accent)" opacity="0.14"/>
  <circle cx="98" cy="68" r="7" fill="var(--accent)"/>
  <text x="118" y="76" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" font-weight="700" letter-spacing="2" fill="var(--accent-ink)">PERSONAL · FIELD NOTES</text>
  <text x="70" y="144" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="800" letter-spacing="-1.4" fill="var(--ink)">Cheap options vs. explicit values</text>

  <!-- Left: Noise & Decision Fatigue -->
  <rect x="70" y="188" width="364" height="374" rx="20" fill="var(--surface)" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="98" y="232" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" font-weight="700" letter-spacing="1.6" fill="#e11d48">LOUD DEFAULTS · BLOCKED</text>

  <rect x="94" y="254" width="316" height="78" rx="14" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="128" cy="293" r="15" fill="#ffe4e6"/>
  <text x="128" y="301" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="23" font-weight="700" fill="#e11d48">×</text>
  <text x="156" y="301" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="650" fill="var(--faint)" text-decoration="line-through">5 AI plans before 8am</text>
  <line x1="434" y1="293" x2="482" y2="293" stroke="#f43f5e" stroke-width="3" stroke-dasharray="5 5"/>

  <rect x="94" y="352" width="316" height="78" rx="14" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="128" cy="391" r="15" fill="#ffe4e6"/>
  <text x="128" y="399" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="23" font-weight="700" fill="#e11d48">×</text>
  <text x="156" y="399" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="650" fill="var(--faint)" text-decoration="line-through">Urgency &amp; prestige</text>
  <line x1="434" y1="391" x2="482" y2="391" stroke="#f43f5e" stroke-width="3" stroke-dasharray="5 5"/>

  <rect x="94" y="450" width="316" height="78" rx="14" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="128" cy="489" r="15" fill="#ffe4e6"/>
  <text x="128" y="497" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="23" font-weight="700" fill="#e11d48">×</text>
  <text x="156" y="497" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="650" fill="var(--faint)" text-decoration="line-through">Completionism</text>
  <line x1="434" y1="489" x2="482" y2="489" stroke="#f43f5e" stroke-width="3" stroke-dasharray="5 5"/>

  <!-- Center: Values Filter Gate -->
  <rect x="486" y="180" width="164" height="390" rx="24" fill="var(--ink)" stroke="var(--accent)" stroke-width="4"/>
  <circle cx="568" cy="264" r="38" fill="var(--accent)" opacity="0.22"/>
  <path d="M 546 248 H 590 L 575 268 V 284 L 561 278 V 268 Z" fill="var(--accent)"/>
  <text x="568" y="346" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" font-weight="700" letter-spacing="2.2" fill="var(--accent)">VALUES</text>
  <text x="568" y="378" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" font-weight="700" letter-spacing="2.2" fill="var(--accent)">FILTER</text>
  <line x1="516" y1="406" x2="620" y2="406" stroke="var(--line)" stroke-width="1.5" opacity="0.35"/>
  <text x="568" y="446" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="750" fill="var(--bg)">Why &gt; What</text>
  <text x="568" y="484" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="19" fill="var(--faint)">48h pause</text>

  <!-- Right: 3 Core Pillars that Pass -->
  <path d="M 650 293 H 690" fill="none" stroke="var(--accent)" stroke-width="3.5" marker-end="url(#tip)"/>
  <rect x="700" y="188" width="430" height="108" rx="18" fill="var(--surface)" stroke="#10b981" stroke-width="3"/>
  <rect x="700" y="188" width="14" height="108" rx="7" fill="#10b981"/>
  <text x="734" y="230" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" font-weight="700" letter-spacing="1.6" fill="#059669">01 · FAMILY WINDOW</text>
  <text x="734" y="269" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="750" fill="var(--ink)">Protect irreplaceable years</text>

  <path d="M 650 391 H 690" fill="none" stroke="var(--accent)" stroke-width="3.5" marker-end="url(#tip)"/>
  <rect x="700" y="321" width="430" height="108" rx="18" fill="var(--surface)" stroke="var(--accent)" stroke-width="3"/>
  <rect x="700" y="321" width="14" height="108" rx="7" fill="var(--accent)"/>
  <text x="734" y="363" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" font-weight="700" letter-spacing="1.6" fill="var(--accent-ink)">02 · FREEDOM TODAY</text>
  <text x="734" y="402" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="750" fill="var(--ink)">Low burn over distant exits</text>

  <path d="M 650 489 H 690" fill="none" stroke="var(--accent)" stroke-width="3.5" marker-end="url(#tip)"/>
  <rect x="700" y="454" width="430" height="108" rx="18" fill="var(--surface)" stroke="#f59e0b" stroke-width="3"/>
  <rect x="700" y="454" width="14" height="108" rx="7" fill="#f59e0b"/>
  <text x="734" y="496" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" font-weight="700" letter-spacing="1.6" fill="#d97706">03 · HEALTH &amp; CRAFT</text>
  <text x="734" y="535" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="750" fill="var(--ink)">Outdoor miles &amp; hands-on work</text>

  <text x="600" y="626" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="25" fill="var(--faint)">in systems we call them principles · in life we call them values</text>
</svg>
