<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="An adapter and a saved score need exact prompts, outputs, and checks before they establish a reproducible result.">
<style>:root{--bg:#faf9f6;--surface:#fff;--ink:#111827;--muted:#5f6875;--line:#d9dde5;--accent:#2563eb}@media(prefers-color-scheme:dark){:root{--bg:#030712;--surface:#111827;--ink:#f9fafb;--muted:#aeb7c4;--line:#334155;--accent:#93c5fd}}text{font-family:ui-sans-serif,system-ui,sans-serif;fill:var(--ink)}.label{font-family:ui-monospace,monospace;font-size:28px;fill:var(--accent)}.note{font-size:30px;fill:var(--muted)}</style>
<rect width="1200" height="675" fill="var(--bg)"/>
<path d="M0 4H1200" stroke="var(--accent)" stroke-width="8"/>
<text x="70" y="85" class="label">FIELD NOTES · FINE-TUNING</text>
<text x="70" y="165" font-size="54" font-weight="700">What makes a result reusable?</text>
<rect x="70" y="245" width="420" height="285" rx="16" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
<text x="110" y="325" font-size="38" font-weight="650">An adapter</text>
<text x="110" y="385" font-size="38" font-weight="650">A saved score</text>
<text x="110" y="465" class="note">What produced them?</text>
<path d="M520 390H625m-20-14 20 14-20 14" fill="none" stroke="var(--accent)" stroke-width="4"/>
<rect x="660" y="245" width="470" height="285" rx="16" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
<text x="700" y="315" class="label">A REPRODUCIBLE RUN</text>
<text x="700" y="385" font-size="32">Prompts and outputs</text>
<text x="700" y="445" font-size="32">Checks for each attempt</text>
<text x="70" y="615" class="note">Evidence has to travel with the result.</text>
</svg>
