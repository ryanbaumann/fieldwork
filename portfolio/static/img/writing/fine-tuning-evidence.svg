<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="The field-mask summary says two base-model exact matches, but the ten individual recorded outputs contain one.">
<style>:root{--bg:#faf9f6;--surface:#fff;--ink:#111827;--muted:#5f6875;--line:#d9dde5;--accent:#2563eb}@media(prefers-color-scheme:dark){:root{--bg:#030712;--surface:#111827;--ink:#f9fafb;--muted:#aeb7c4;--line:#334155;--accent:#93c5fd}}text{font-family:ui-sans-serif,system-ui,sans-serif;fill:var(--ink)}.label{font-family:ui-monospace,monospace;font-size:28px;fill:var(--accent)}.note{font-size:30px;fill:var(--muted)}</style>
<rect width="1200" height="675" fill="var(--bg)"/>
<path d="M0 4H1200" stroke="var(--accent)" stroke-width="8"/>
<text x="70" y="85" class="label">THE SAVED FIELD-MASK RECORD</text>
<text x="70" y="165" font-size="50" font-weight="700">The base-model counts disagree</text>
<rect x="70" y="235" width="500" height="300" rx="16" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
<text x="320" y="300" text-anchor="middle" class="note">Saved summary</text>
<text x="320" y="430" text-anchor="middle" font-size="112" font-weight="700">2</text>
<text x="320" y="495" text-anchor="middle" class="note">exact matches</text>
<rect x="630" y="235" width="500" height="300" rx="16" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
<text x="880" y="300" text-anchor="middle" class="note">Individual outputs</text>
<text x="880" y="430" text-anchor="middle" font-size="112" font-weight="700">1</text>
<text x="880" y="495" text-anchor="middle" class="note">exact match</text>
<text x="70" y="615" class="note">Same ten recorded cases. No new inference run.</text>
</svg>
